services:
  - type: web
    name: music-detector-backend
    runtime: node
    plan: free
    buildCommand: "mkdir -p bin/linux && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/linux/yt-dlp && curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ --wildcards --strip-components=2 -C bin/linux/ \"*/bin/ffmpeg\" \"*/bin/ffprobe\" && curl -L https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-linux-x86_64.tar.gz | tar -xz --strip-components=1 -C bin/linux/ chromaprint-fpcalc-1.5.1-linux-x86_64/fpcalc && chmod +x bin/linux/* && npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACOUSTID_API_KEY
        sync: false
        placeholder: "Get a free API key from https://acoustid.org/login"
      - key: RAPIDAPI_KEYS
        sync: false
        placeholder: "Your Shazam RapidAPI keys (comma-separated for rotation)"
      - key: RAPIDAPI_KEY
        sync: false
        placeholder: "Optional single key fallback if RAPIDAPI_KEYS is omitted"
      - key: RAPIDAPI_HOST
        value: shazam.p.rapidapi.com